<path class="flow" d="M 456.15 185.0 H 455.575 V 240.0 H 455.0" fill="none" stroke="#2583b3" stroke-width="1.8" marker-end="url(#arrow)"/>
<path class="flow" d="M 245.0 327.5 H 292.5 V 311.25 H 340.0" fill="none" stroke="#2583b3" stroke-width="1.8" marker-end="url(#arrow)"/>
<path class="flow" d="M 570.0 287.5 H 595.0 V 287.5 H 620.0" fill="none" stroke="#2583b3" stroke-width="1.8" marker-end="url(#arrow)"/>
<image x="333.0" y="35.0" width="30.0" height="30.0" href="data:image/svg+xml;base64,"/>
<text x="375.0" y="56.85" font-family="Arial,sans-serif" font-size="18.0" font-weight="600" fill="#183951">VM and its Azure assignment</text>
<image x="35.0" y="123.0" width="30.0" height="30.0" href="data:image/svg+xml;base64,"/>
<text x="78.0" y="139.85" font-family="Arial,sans-serif" font-size="18.0" font-weight="600" fill="#183951">Azure Policy</text>
<text x="37.0" y="179.05" font-family="Arial,sans-serif" font-size="14.0" font-weight="400" fill="#183951">DeployIfNotExists</text>
<text x="37.0" y="305.85" font-family="Arial,sans-serif" font-size="18.0" font-weight="600" fill="#183951">Hosted package .zip</text>
<text x="37.0" y="335.6" font-family="Arial,sans-serif" font-size="14.0" font-weight="400" fill="#183951">Desired values + code</text>
<text x="37.0" y="354.5" font-family="Arial,sans-serif" font-size="14.0" font-weight="400" fill="#183951">Available to download</text>
<text x="358.0" y="128.025" font-family="Arial,sans-serif" font-size="17.0" font-weight="600" fill="#183951">Configuration assignment</text>
<text x="358.0" y="159.55" font-family="Arial,sans-serif" font-size="14.0" font-weight="400" fill="#183951">In Azure: package address · settings · mode</text>
<text x="355.0" y="266.7" font-family="Arial,sans-serif" font-size="16.0" font-weight="600" fill="#183951">Machine Configuration</text>
<text x="355.0" y="291.7" font-family="Arial,sans-serif" font-size="16.0" font-weight="600" fill="#183951">agent</text>
<text x="355.0" y="315.725" font-family="Arial,sans-serif" font-size="13.0" font-weight="400" fill="#183951">Inside Windows or Linux</text>
<text x="637.0" y="267.525" font-family="Arial,sans-serif" font-size="17.0" font-weight="600" fill="#183951">DSC resources</text>
<text x="637.0" y="307.05" font-family="Arial,sans-serif" font-size="14.0" font-weight="400" fill="#183951">Read → check → apply*</text>
<text x="342.0" y="384.2" font-family="Arial,sans-serif" font-size="16.0" font-weight="600" fill="#183951">Example: password length 8 → required 14</text>
<text x="342.0" y="412.725" font-family="Arial,sans-serif" font-size="13.0" font-weight="400" fill="#183951">* Apply only with Set support and an apply mode.</text>
</svg>