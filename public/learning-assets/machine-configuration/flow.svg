<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">Machine Configuration flow</title><desc id="d">Policy targets a machine assignment. The assignment references a package. The VM agent downloads the package, checks or applies settings, and reports compliance to Azure.</desc><rect width="960" height="300" fill="white"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#f1f5f9" stroke="#475569" stroke-width="2"><rect x="20" y="65" width="205" height="100" rx="10"/><rect x="320" y="65" width="260" height="100" rx="10"/><rect x="685" y="65" width="255" height="100" rx="10"/></g><g fill="#0f172a" font-size="21"><text x="123" y="106">Azure Policy</text><text x="450" y="106">Machine assignment</text><text x="812" y="106">Agent inside VM</text></g><g fill="#475569" font-size="16"><text x="123" y="135">Which machines?</text><text x="450" y="135">Which package and mode?</text><text x="812" y="135">Check or apply settings</text><text x="270" y="92">Targets</text><text x="633" y="92">Package</text><text x="633" y="145">download</text><text x="480" y="249">Reports compliance and individual setting results to Azure</text></g><g fill="none" stroke="#2563eb" stroke-width="3"><path d="M232 115H309m-10-7 10 7-10 7M590 115H674m-10-7 10 7-10 7"/><path d="M810 177V215H125V177m-7 10 7-10 7 10"/></g></g></svg>