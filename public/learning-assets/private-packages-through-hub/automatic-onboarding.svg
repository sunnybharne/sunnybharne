<svg xmlns="http://www.w3.org/2000/svg" width="960" height="943" viewBox="0 0 960 943" role="img" aria-labelledby="title desc"><title id="title">Automatic onboarding using platform and landing-zone code</title><desc id="desc">Four steps show the platform foundation, deployment of a new landing zone, VM onboarding through policies and an acceptance check. Large estates repeat regional hub patterns within current network limits. IaC configures network and DNS; policies configure applicable VMs.</desc><defs><marker id="1457a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1457a6"/></marker><marker id="087d6f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087d6f"/></marker><marker id="7148a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7148a7"/></marker></defs><rect width="960" height="943" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="45" fill="#183045" font-size="32" font-weight="700" text-anchor="start">03 / Configure the template once</text><text x="32" y="80" fill="#4e6477" font-size="23" font-weight="400" text-anchor="start">Repeat the deployment automatically as subscriptions are added.</text><rect x="32" y="112" width="896" height="123" rx="14" fill="#effaf7" stroke="#087d6f" stroke-width="2"/><circle cx="75" cy="159" r="23" fill="#087d6f"/><text x="75" y="167" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">1</text><text x="116" y="164" fill="#087d6f" font-size="28" font-weight="700" text-anchor="start">Platform foundation</text><text x="55" y="207" fill="#183045" font-size="23" font-weight="400" text-anchor="start">Create hub, Blob endpoint, central DNS and package storage.</text><path d="M480 235 V269" fill="none" stroke="#087d6f" stroke-width="3" marker-end="url(#087d6f)"/><rect x="32" y="279" width="896" height="123" rx="14" fill="#f1f6fd" stroke="#1457a6" stroke-width="2"/><circle cx="75" cy="326" r="23" fill="#1457a6"/><text x="75" y="334" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">2</text><text x="116" y="331" fill="#1457a6" font-size="28" font-weight="700" text-anchor="start">New landing zone</text><text x="55" y="374" fill="#183045" font-size="23" font-weight="400" text-anchor="start">Create the VNet, peer to its hub and set the hub DNS resolver.</text><path d="M480 402 V436" fill="none" stroke="#1457a6" stroke-width="3" marker-end="url(#1457a6)"/><rect x="32" y="446" width="896" height="123" rx="14" fill="#f5f0fb" stroke="#7148a7" stroke-width="2"/><circle cx="75" cy="493" r="23" fill="#7148a7"/><text x="75" y="501" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">3</text><text x="116" y="498" fill="#7148a7" font-size="28" font-weight="700" text-anchor="start">VM onboarding</text><text x="55" y="541" fill="#183045" font-size="23" font-weight="400" text-anchor="start">Apply inherited policies; prepare the agent and read identity.</text><path d="M480 569 V603" fill="none" stroke="#7148a7" stroke-width="3" marker-end="url(#7148a7)"/><rect x="32" y="613" width="896" height="123" rx="14" fill="#effaf7" stroke="#087d6f" stroke-width="2"/><circle cx="75" cy="660" r="23" fill="#087d6f"/><text x="75" y="668" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">4</text><text x="116" y="665" fill="#087d6f" font-size="28" font-weight="700" text-anchor="start">Automated acceptance check</text><text x="55" y="708" fill="#183045" font-size="23" font-weight="400" text-anchor="start">Resolve private IP → download ZIP → apply → report compliance.</text><rect x="32" y="779" width="896" height="132" rx="14" fill="#f6f8fa" stroke="#c5d3df" stroke-width="2"/><text x="55" y="817" fill="#183045" font-size="26" font-weight="700" text-anchor="start">At larger scale: repeat the hub pattern</text><text x="55" y="855" fill="#183045" font-size="23" font-weight="400" text-anchor="start">Group spokes by region and capacity. Keep one reviewed code pattern.</text><text x="55" y="887" fill="#4e6477" font-size="23" font-weight="400" text-anchor="start">Automation removes manual setup; network limits still apply.</text></g></svg>
