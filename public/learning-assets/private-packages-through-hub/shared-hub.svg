<svg xmlns="http://www.w3.org/2000/svg" width="960" height="812" viewBox="0 0 960 812" role="img" aria-labelledby="title desc"><title id="title">Private configuration packages through a shared hub</title><desc id="desc">Three separate subscription VNets connect directly to a regional hub by peering. A Blob private endpoint sits in a dedicated hub subnet. Azure Blob Storage remains outside the VNet, in the platform subscription. VMs initiate downloads through the endpoint; responses carry the ZIP. This diagram omits DNS and permission details.</desc><defs><marker id="1457a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1457a6"/></marker><marker id="087d6f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087d6f"/></marker><marker id="7148a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7148a7"/></marker></defs><rect width="960" height="812" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="45" fill="#183045" font-size="31" font-weight="700" text-anchor="start">01 / One shared private download point</text><text x="32" y="79" fill="#4e6477" font-size="21" font-weight="400" text-anchor="start">Proposed design · one regional hub · illustrative names</text><rect x="32" y="115" width="260" height="150" rx="14" fill="#f1f6fd" stroke="#1457a6" stroke-width="2"/><text x="52" y="150" fill="#1457a6" font-size="24" font-weight="700" text-anchor="start">Subscription A</text><text x="52" y="184" fill="#183045" font-size="22" font-weight="400" text-anchor="start">Spoke VNet</text><rect x="52" y="202" width="220" height="44" rx="14" fill="#fff" stroke="#c5d3df" stroke-width="2"/><text x="162" y="232" fill="#183045" font-size="22" font-weight="600" text-anchor="middle">Private VM</text><path d="M162 266 V300 H480 V332" fill="none" stroke="#1457a6" stroke-width="3" marker-end="url(#1457a6)"/><rect x="350" y="115" width="260" height="150" rx="14" fill="#f1f6fd" stroke="#1457a6" stroke-width="2"/><text x="370" y="150" fill="#1457a6" font-size="24" font-weight="700" text-anchor="start">Subscription B</text><text x="370" y="184" fill="#183045" font-size="22" font-weight="400" text-anchor="start">Spoke VNet</text><rect x="370" y="202" width="220" height="44" rx="14" fill="#fff" stroke="#c5d3df" stroke-width="2"/><text x="480" y="232" fill="#183045" font-size="22" font-weight="600" text-anchor="middle">Private VM</text><path d="M480 266 V300 H480 V332" fill="none" stroke="#1457a6" stroke-width="3" marker-end="url(#1457a6)"/><rect x="668" y="115" width="260" height="150" rx="14" fill="#f1f6fd" stroke="#1457a6" stroke-width="2"/><text x="688" y="150" fill="#1457a6" font-size="24" font-weight="700" text-anchor="start">New subscription</text><text x="688" y="184" fill="#183045" font-size="22" font-weight="400" text-anchor="start">Spoke VNet</text><rect x="688" y="202" width="220" height="44" rx="14" fill="#fff" stroke="#c5d3df" stroke-width="2"/><text x="798" y="232" fill="#183045" font-size="22" font-weight="600" text-anchor="middle">Private VM</text><path d="M798 266 V300 H480 V332" fill="none" stroke="#1457a6" stroke-width="3" marker-end="url(#1457a6)"/><rect x="316" y="282" width="328" height="36" rx="14" fill="#fff" stroke="#fff" stroke-width="2"/><text x="480" y="308" fill="#1457a6" font-size="21" font-weight="600" text-anchor="middle">Each spoke peers to the hub</text><rect x="32" y="338" width="548" height="308" rx="14" fill="#effaf7" stroke="#087d6f" stroke-width="2"/><text x="55" y="375" fill="#087d6f" font-size="25" font-weight="700" text-anchor="start">Platform subscription</text><text x="55" y="408" fill="#183045" font-size="23" font-weight="600" text-anchor="start">Hub VNet</text><rect x="62" y="437" width="488" height="174" rx="14" fill="#fff" stroke="#087d6f" stroke-width="2" stroke-dasharray="7 5"/><text x="84" y="469" fill="#087d6f" font-size="22" font-weight="600" text-anchor="start">Private endpoint subnet</text><rect x="84" y="487" width="443" height="96" rx="14" fill="#eef8f5" stroke="#087d6f" stroke-width="2"/><text x="305" y="524" fill="#183045" font-size="27" font-weight="700" text-anchor="middle">Blob private endpoint</text><text x="305" y="556" fill="#4e6477" font-size="22" font-weight="400" text-anchor="middle">A private IP for package downloads</text><path d="M480 332 V437" fill="none" stroke="#1457a6" stroke-width="3" marker-end="url(#1457a6)"/><path d="M550 530 H652" fill="none" stroke="#087d6f" stroke-width="3" marker-end="url(#087d6f)"/><text x="616" y="479" fill="#087d6f" font-size="20" font-weight="600" text-anchor="middle">Private</text><text x="616" y="502" fill="#087d6f" font-size="20" font-weight="600" text-anchor="middle">Link</text><rect x="660" y="415" width="268" height="220" rx="14" fill="#f5f7fa" stroke="#c5d3df" stroke-width="2"/><text x="682" y="453" fill="#4e6477" font-size="20" font-weight="400" text-anchor="start">Platform subscription</text><text x="682" y="493" fill="#183045" font-size="29" font-weight="700" text-anchor="start">Blob Storage</text><text x="682" y="532" fill="#183045" font-size="22" font-weight="400" text-anchor="start">Configuration ZIPs</text><text x="682" y="568" fill="#087d6f" font-size="22" font-weight="600" text-anchor="start">Public access: off</text><text x="682" y="608" fill="#4e6477" font-size="21" font-weight="400" text-anchor="start">Outside the VNet</text><rect x="32" y="682" width="896" height="99" rx="14" fill="#f6f8fa" stroke="#c5d3df" stroke-width="2"/><text x="54" y="719" fill="#183045" font-size="23" font-weight="600" text-anchor="start">The VM starts an HTTPS request. The ZIP returns on that connection.</text><text x="54" y="751" fill="#4e6477" font-size="22" font-weight="400" text-anchor="start">DNS and read permission are also required. No spoke-to-spoke route.</text></g></svg>
