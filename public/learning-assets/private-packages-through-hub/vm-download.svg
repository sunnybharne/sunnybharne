<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1040" viewBox="0 0 960 1040" role="img" aria-labelledby="title desc"><title id="title">How a private VM gets and applies the package</title><desc id="desc">Policy deploys an assignment containing package metadata, not the ZIP itself. The VM resolves the storage hostname through the central DNS resolver, initiates an authenticated private download, checks the content hash, applies the setting and reports to Machine Configuration over the separately configured service path.</desc><defs><marker id="1457a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1457a6"/></marker><marker id="087d6f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087d6f"/></marker><marker id="7148a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7148a7"/></marker></defs><rect width="960" height="1040" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="45" fill="#183045" font-size="30" font-weight="700" text-anchor="start">02 / An instruction and a download are different</text><text x="32" y="80" fill="#4e6477" font-size="22" font-weight="400" text-anchor="start">Policy chooses the setting. The VM agent retrieves and applies it.</text><rect x="32" y="112" width="896" height="143" rx="14" fill="#f5f0fb" stroke="#7148a7" stroke-width="2"/><text x="55" y="148" fill="#7148a7" font-size="25" font-weight="700" text-anchor="start">1   Azure Policy at the organisation management group</text><text x="55" y="184" fill="#183045" font-size="23" font-weight="400" text-anchor="start">Applicable VMs receive a Machine Configuration assignment.</text><text x="55" y="220" fill="#183045" font-size="23" font-weight="400" text-anchor="start">It names the ZIP URL, expected hash and desired settings.</text><path d="M480 255 V304" fill="none" stroke="#7148a7" stroke-width="3" marker-end="url(#7148a7)" stroke-dasharray="8 6"/><text x="501" y="289" fill="#7148a7" font-size="20" font-weight="600" text-anchor="start">Instruction</text><rect x="32" y="314" width="896" height="355" rx="14" fill="#f5f9fd" stroke="#1457a6" stroke-width="2"/><text x="55" y="354" fill="#1457a6" font-size="27" font-weight="700" text-anchor="start">2   Agent inside the private VM</text><rect x="55" y="380" width="398" height="240" rx="14" fill="#fff" stroke="#c5d3df" stroke-width="2"/><text x="76" y="418" fill="#183045" font-size="25" font-weight="700" text-anchor="start">Find the address</text><text x="76" y="456" fill="#183045" font-size="22" font-weight="400" text-anchor="start">Ask the hub DNS resolver:</text><text x="76" y="491" fill="#183045" font-size="22" font-weight="400" text-anchor="start">“Where is package storage?”</text><text x="76" y="545" fill="#183045" font-size="22" font-weight="400" text-anchor="start">Answer: the hub endpoint’s</text><text x="76" y="578" fill="#183045" font-size="22" font-weight="400" text-anchor="start">private IP address.</text><rect x="479" y="380" width="425" height="240" rx="14" fill="#fff" stroke="#c5d3df" stroke-width="2"/><text x="500" y="418" fill="#183045" font-size="25" font-weight="700" text-anchor="start">Download the ZIP</text><text x="500" y="456" fill="#183045" font-size="22" font-weight="400" text-anchor="start">Connect to that private IP.</text><text x="500" y="491" fill="#183045" font-size="22" font-weight="400" text-anchor="start">Storage checks the VM identity.</text><text x="500" y="545" fill="#183045" font-size="22" font-weight="400" text-anchor="start">Read permitted? Return ZIP.</text><text x="500" y="578" fill="#183045" font-size="22" font-weight="400" text-anchor="start">Agent verifies its hash.</text><path d="M455 508 H477" fill="none" stroke="#1457a6" stroke-width="3" marker-end="url(#1457a6)"/><path d="M480 670 V714" fill="none" stroke="#1457a6" stroke-width="3" marker-end="url(#1457a6)"/><rect x="32" y="724" width="896" height="95" rx="14" fill="#effaf7" stroke="#087d6f" stroke-width="2"/><text x="55" y="762" fill="#087d6f" font-size="25" font-weight="700" text-anchor="start">3   Apply the setting inside Windows</text><text x="55" y="795" fill="#183045" font-size="23" font-weight="400" text-anchor="start">For example, correct the chosen local password-policy setting.</text><path d="M480 820 V859" fill="none" stroke="#7148a7" stroke-width="3" marker-end="url(#7148a7)" stroke-dasharray="8 6"/><rect x="32" y="869" width="896" height="105" rx="14" fill="#f5f0fb" stroke="#7148a7" stroke-width="2"/><text x="55" y="909" fill="#7148a7" font-size="25" font-weight="700" text-anchor="start">4   Report the result to Machine Configuration</text><text x="55" y="947" fill="#183045" font-size="22" font-weight="400" text-anchor="start">Service communication uses a separately configured Azure platform path.</text><text x="32" y="1015" fill="#4e6477" font-size="21" font-weight="400" text-anchor="start">Purple dashed arrows: management flow. Blue arrows: VM work.</text></g></svg>
