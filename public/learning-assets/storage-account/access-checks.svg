<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="title description">
  <title id="title">Two checks before reading or writing a blob</title>
  <desc id="description">A client must pass two checks: the network path must be allowed, and the request must be authorized to access the data. Only then can the client read or write the blob. Managing storage account settings is separate from reading its data.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#47738c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="480" height="520" fill="#fff"/>
  <g fill="none" stroke="#47738c" stroke-width="2" marker-end="url(#arrow)">
    <path d="M240 72 V101"/>
    <path d="M240 180 V221"/>
    <path d="M240 300 V341"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="12" y="12" width="456" height="60" rx="10" fill="#fff" stroke="#d0e0eb"/>
    <text x="240" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#183951">Client</text>

    <rect x="12" y="108" width="456" height="72" rx="10" fill="#f5f9fc" stroke="#d0e0eb"/>
    <circle cx="45" cy="144" r="19" fill="#eaf3f8"/>
    <text x="45" y="151" text-anchor="middle" font-size="20" font-weight="700" fill="#245a78">1</text>
    <text x="82" y="151" font-size="23" font-weight="700" fill="#183951">Allowed network path?</text>
    <text x="257" y="207" font-size="18" fill="#35586d">Yes</text>

    <rect x="12" y="228" width="456" height="72" rx="10" fill="#f5f9fc" stroke="#d0e0eb"/>
    <circle cx="45" cy="264" r="19" fill="#eaf3f8"/>
    <text x="45" y="271" text-anchor="middle" font-size="20" font-weight="700" fill="#245a78">2</text>
    <text x="82" y="271" font-size="23" font-weight="700" fill="#183951">Authorized for data?</text>
    <text x="257" y="327" font-size="18" fill="#35586d">Yes</text>

    <rect x="12" y="348" width="456" height="60" rx="10" fill="#f3f8f4" stroke="#c7dfcc"/>
    <text x="240" y="386" text-anchor="middle" font-size="24" font-weight="700" fill="#285a38">Read or write blob</text>

    <text x="12" y="451" font-size="23" font-weight="700" fill="#183951">Both checks must pass.</text>
    <text x="12" y="483" font-size="19" fill="#526774">Managing account settings is separate</text>
    <text x="12" y="508" font-size="19" fill="#526774">from reading data.</text>
  </g>
</svg>
