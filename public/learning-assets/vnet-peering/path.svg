<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img" aria-labelledby="title desc"><title id="title">Bastion across VNet peering</title><desc id="desc">Laptop uses HTTPS over the Internet to reach Bastion in the hub. Bastion uses private peering and RDP to reach a VM in the spoke.</desc><rect width="960" height="230" fill="#fff"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#f1f5f9" stroke="#475569" stroke-width="2"><rect x="20" y="65" width="190" height="105" rx="10"/><rect x="380" y="65" width="200" height="105" rx="10"/><rect x="750" y="65" width="190" height="105" rx="10"/></g><g fill="#0f172a" font-size="21"><text x="115" y="105">Laptop</text><text x="480" y="105">Hub: Bastion</text><text x="845" y="105">Spoke: VM</text></g><g fill="#475569" font-size="16"><text x="115" y="138">Browser</text><text x="480" y="138">Public HTTPS entry</text><text x="845" y="138">Private IP only</text><text x="295" y="88">Internet</text><text x="295" y="151">HTTPS · 443</text><text x="665" y="88">Private peering</text><text x="665" y="151">RDP · 3389</text><text x="480" y="210">Both peering links must be Connected. Firewall rules and login rights still apply.</text></g><g stroke="#2563eb" stroke-width="3" fill="none"><path d="M220 116H364m-10-7 10 7-10 7"/><path d="M590 116H734m-10-7 10 7-10 7"/></g></g></svg>