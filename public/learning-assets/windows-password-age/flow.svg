<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
<title id="title">How maximum password age reaches Windows</title>
<desc id="desc">Azure Policy deploys a machine assignment. The VM agent downloads the versioned package, reads Windows password policy and corrects it to at most 42 days.</desc>
<rect width="960" height="230" fill="#fff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs>
<g fill="#f8fafc" stroke="#94a3b8"><rect x="16" y="58" width="205" height="110" rx="8"/><rect x="257" y="58" width="205" height="110" rx="8"/><rect x="498" y="58" width="205" height="110" rx="8"/><rect x="739" y="58" width="205" height="110" rx="8"/></g>
<g stroke="#475569" stroke-width="2" marker-end="url(#arrow)"><path d="M221 113H251"/><path d="M462 113H492"/><path d="M703 113H733"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#0f172a"><g font-size="18" font-weight="bold"><text x="118" y="92">Azure Policy</text><text x="359" y="92">Machine assignment</text><text x="600" y="92">VM agent + package</text><text x="841" y="92">Windows policy</text></g><g font-size="15"><text x="118" y="122">DeployIfNotExists</text><text x="359" y="122">URL + hash + mode</text><text x="600" y="122">Get → Test → Set</text><text x="841" y="122">90 days → 42 days</text><text x="118" y="148">Lab scope</text><text x="359" y="148">ApplyAndAutoCorrect</text><text x="600" y="148">Downloads over HTTPS</text><text x="841" y="148">Report compliance</text><text x="480" y="207">Later drift is corrected by the agent at its next evaluation.</text></g></g>
</svg>
