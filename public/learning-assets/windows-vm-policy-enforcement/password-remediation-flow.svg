<svg xmlns="http://www.w3.org/2000/svg" width="620" height="470" viewBox="0 0 620 470" role="img" aria-labelledby="title description">
  <title id="title">How password remediation changes a Windows setting</title>
  <desc id="description">Azure Policy remediation deploys a guest assignment in ApplyAndAutoCorrect mode. The guest agent inside the VM downloads the versioned ZIP and verifies its hash. The package's DSC Set operation changes local minimum password length from 8 to 14. The guest agent then reports this password setting as Compliant. The Windows baseline audit reports separately.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#47738c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="620" height="470" fill="#fff"/>
  <g fill="none" stroke="#47738c" stroke-width="2" marker-end="url(#arrow)">
    <path d="M310 96 V121"/>
    <path d="M310 206 V231"/>
    <path d="M310 316 V341"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="12" y="12" width="596" height="84" rx="10" fill="#fff" stroke="#d0e0eb"/>
      <circle cx="47" cy="54" r="19" fill="#eaf3f8"/>
      <text x="47" y="61" text-anchor="middle" font-size="20" font-weight="700" fill="#245a78">1</text>
      <text x="82" y="45" font-size="23" font-weight="700" fill="#183951">Azure Policy remediation</text>
      <text x="82" y="74" font-size="18" fill="#35586d">Deploys guest assignment: ApplyAndAutoCorrect</text>
    </g>
    <g>
      <rect x="12" y="122" width="596" height="84" rx="10" fill="#f5f9fc" stroke="#d0e0eb"/>
      <circle cx="47" cy="164" r="19" fill="#eaf3f8"/>
      <text x="47" y="171" text-anchor="middle" font-size="20" font-weight="700" fill="#245a78">2</text>
      <text x="82" y="155" font-size="23" font-weight="700" fill="#183951">Guest agent inside the VM</text>
      <text x="82" y="184" font-size="18" fill="#35586d">Downloads the ZIP and verifies its content hash</text>
    </g>
    <g>
      <rect x="12" y="232" width="596" height="84" rx="10" fill="#f5f9fc" stroke="#d0e0eb"/>
      <circle cx="47" cy="274" r="19" fill="#eaf3f8"/>
      <text x="47" y="281" text-anchor="middle" font-size="20" font-weight="700" fill="#245a78">3</text>
      <text x="82" y="265" font-size="23" font-weight="700" fill="#183951">DSC Set changes Windows</text>
      <text x="82" y="294" font-size="20" fill="#35586d">Local minimum password length: 8 → 14</text>
    </g>
    <g>
      <rect x="12" y="342" width="596" height="84" rx="10" fill="#f3f8f4" stroke="#c7dfcc"/>
      <circle cx="47" cy="384" r="19" fill="#e0f0e4"/>
      <text x="47" y="391" text-anchor="middle" font-size="20" font-weight="700" fill="#285a38">4</text>
      <text x="82" y="375" font-size="23" font-weight="700" fill="#183951">Guest report</text>
      <text x="82" y="404" font-size="20" fill="#285a38">Compliant for this password setting</text>
    </g>
    <text x="12" y="455" font-size="17" fill="#526774">The baseline audit reports separately.</text>
  </g>
</svg>
